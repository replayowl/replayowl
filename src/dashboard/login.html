<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Replayowl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11.5' cy='16' r='6' fill='%23f2a93b'/%3E%3Ccircle cx='20.5' cy='16' r='6' fill='%23f2a93b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body class="auth-body">
<main class="auth-card">
  <div class="auth-mark" id="mark"></div>
  <h1 id="heading">Sign in to Replayowl</h1>
  <p class="auth-lead" id="lead"></p>
  <p class="form-error" id="error" role="alert" hidden></p>
  <a class="btn wide oauth-btn" id="oauth" href="/api/auth/oauth/start" hidden></a>
  <div class="auth-or" id="or" hidden><span>or use the password</span></div>
  <form id="form" novalidate hidden>
    <label class="field" id="token-field" hidden><span>Setup token</span><input id="token" type="text" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span id="password-label">Password</span><input id="password" type="password" autocomplete="current-password" required></label>
    <label class="field" id="confirm-field" hidden><span>Repeat password</span><input id="confirm" type="password" autocomplete="new-password"></label>
    <button class="btn primary wide" id="submit" type="submit">Sign in</button>
  </form>
</main>
<script type="module" src="/dashboard/login.js"></script>
</body>
</html>
