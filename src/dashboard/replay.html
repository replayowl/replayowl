<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay - Replayowl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11.5' cy='16' r='6' fill='%23f2a93b'/%3E%3Ccircle cx='20.5' cy='16' r='6' fill='%23f2a93b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<div class="replay-page">
  <header class="topbar">
    <a class="brand" href="/" id="brand" title="All sessions"></a>
    <div class="title"><b id="title">Loading session</b><small id="subtitle"></small></div>
    <span class="grow"></span>
    <div class="keys">
      <button class="btn ghost-dark" id="keys-btn" aria-expanded="false" aria-controls="keys-pop">Shortcuts</button>
      <div class="keys-pop" id="keys-pop" hidden>
        <dl>
          <dt><kbd>Space</kbd></dt><dd>Play or pause</dd>
          <dt><kbd>&larr;</kbd> <kbd>&rarr;</kbd></dt><dd>Back or forward 5 seconds</dd>
          <dt><kbd>Shift</kbd> + arrows</dt><dd>Back or forward 15 seconds</dd>
          <dt><kbd>,</kbd> <kbd>.</kbd></dt><dd>Previous or next event</dd>
          <dt><kbd>1</kbd> to <kbd>5</kbd></dt><dd>Speed 0.5&times; to 8&times;</dd>
          <dt><kbd>S</kbd></dt><dd>Skip inactivity on or off</dd>
          <dt><kbd>T</kbd></dt><dd>Mouse trail on or off</dd>
          <dt><kbd>F</kbd></dt><dd>Full screen</dd>
        </dl>
      </div>
    </div>
  </header>
  <div class="replay-body">
    <section class="player-col">
      <div class="urlbar">
        <div class="addr"><svg viewBox="0 0 16 16"><path d="M8 1a5 5 0 0 0-5 5v1H2v8h12V7h-1V6a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v1H5z"/></svg><span id="url"></span></div>
        <span class="page-count" id="page-count"></span>
        <span class="dims" id="dims"></span>
      </div>
      <div id="player"><div class="loading">Loading session</div></div>
    </section>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="activity">Activity<span class="count" id="c-activity"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="console">Console<span class="count" id="c-console"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="details">Details</button>
      </div>
      <div class="panel" id="p-activity" role="tabpanel">
        <div class="follow"><span>Click an event to jump to it</span><label><input type="checkbox" id="follow" checked> Follow playback</label></div>
        <div id="events"></div>
      </div>
      <div class="panel" id="p-console" role="tabpanel" hidden></div>
      <div class="panel details" id="p-details" role="tabpanel" hidden></div>
    </aside>
  </div>
</div>
<script type="module" src="/dashboard/replay.js"></script>
</body>
</html>
